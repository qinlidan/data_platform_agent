<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手 - 异步落表演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-content {
            flex: 1;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        #newChatBtn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        #newChatBtn:hover {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }
        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .message.user { justify-content: flex-end; }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .message.tool .message-content {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        #messageInput:focus { border-color: #667eea; }
        #sendBtn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #sendBtn:hover { transform: scale(1.05); }
        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .status {
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f0f0f0;
            border-top: 1px solid #e0e0e0;
        }
        .status.streaming { color: #667eea; font-weight: 500; }
        .typing-indicator {
            display: inline-block;
            padding: 10px 16px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🤖 AI 助手</h1>
                <p>基于 Spring AI + 异步落表 | 实时流式对话</p>
            </div>
            <button id="newChatBtn" onclick="newChat()">➕ 新建会话</button>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    你好！我是数据平台 AI 助手。你可以问我关于作业、数据源、FAQ 的问题，我会帮你查询和操作。
                </div>
            </div>
        </div>
        <div class="status" id="status">就绪</div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="输入你的问题..." />
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const USER_ID = 'QINLIDAN';  // 写死用户ID
        const STORAGE_KEY = 'ai_conversation_id';

        let conversationId = null;
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        // 初始化：从 localStorage 读取会话ID
        function initConversation() {
            const savedId = localStorage.getItem(STORAGE_KEY);
            if (savedId) {
                conversationId = parseInt(savedId);
                console.log('从 localStorage 恢复会话:', conversationId);
                statusEl.textContent = '已恢复历史会话';
            } else {
                console.log('首次访问，等待创建新会话');
                statusEl.textContent = '就绪';
            }
        }

        // 保存会话ID到 localStorage
        function saveConversationId(id) {
            conversationId = id;
            localStorage.setItem(STORAGE_KEY, id);
            console.log('会话ID已保存到 localStorage:', id);
        }

        // 清除会话ID
        function clearConversationId() {
            conversationId = null;
            localStorage.removeItem(STORAGE_KEY);
            console.log('已清除 localStorage 中的会话ID');
        }

        // 添加消息到界面
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // 添加打字指示器
        function addTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typing-indicator';
            messageDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 移除打字指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        // HTML 转义
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[char]);
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 显示用户消息
            addMessage('user', message);
            messageInput.value = '';
            sendBtn.disabled = true;
            statusEl.textContent = '正在发送...';
            statusEl.className = 'status streaming';

            // 添加打字指示器
            addTypingIndicator();

            try {
                // 构建请求URL，带上 userId 和 conversationId（如果有）
                let url = `/api/ai/chat/stream?message=${encodeURIComponent(message)}&userId=${USER_ID}`;
                if (conversationId) {
                    url += `&conversationId=${conversationId}`;
                }

                const eventSource = new EventSource(url);

                let assistantMessage = '';
                let assistantDiv = null;

                // 接收 conversationId（首次对话时后端返回）
                eventSource.addEventListener('conversation_id', (event) => {
                    const data = JSON.parse(event.data);
                    if (data.conversationId) {
                        saveConversationId(data.conversationId);
                        console.log('收到新会话ID:', data.conversationId);
                    }
                });

                eventSource.addEventListener('text', (event) => {
                    removeTypingIndicator();
                    const data = JSON.parse(event.data);
                    assistantMessage += data.content;

                    if (!assistantDiv) {
                        assistantDiv = addMessage('assistant', assistantMessage);
                    } else {
                        assistantDiv.querySelector('.message-content').textContent = assistantMessage;
                    }
                    statusEl.textContent = '正在接收响应...';
                });

                eventSource.addEventListener('tool_start', (event) => {
                    const data = JSON.parse(event.data);
                    statusEl.textContent = `工具调用: ${data.toolName}`;
                });

                eventSource.addEventListener('tool_end', (event) => {
                    const data = JSON.parse(event.data);
                    addMessage('tool', `[工具] ${data.toolName}\n${data.result}`);
                    statusEl.textContent = '工具执行完成';
                });

                eventSource.addEventListener('done', (event) => {
                    removeTypingIndicator();
                    eventSource.close();
                    sendBtn.disabled = false;
                    statusEl.textContent = '就绪';
                    statusEl.className = 'status';
                });

                eventSource.addEventListener('error', (event) => {
                    removeTypingIndicator();
                    const data = JSON.parse(event.data);
                    addMessage('assistant', `⚠️ 错误: ${data.message}`);
                    eventSource.close();
                    sendBtn.disabled = false;
                    statusEl.textContent = '发生错误';
                    statusEl.className = 'status';
                });

                eventSource.onerror = () => {
                    removeTypingIndicator();
                    eventSource.close();
                    sendBtn.disabled = false;
                    statusEl.textContent = '连接失败';
                    statusEl.className = 'status';
                };

            } catch (error) {
                removeTypingIndicator();
                console.error('Error:', error);
                addMessage('assistant', '⚠️ 发送失败，请重试');
                sendBtn.disabled = false;
                statusEl.textContent = '发送失败';
                statusEl.className = 'status';
            }
        }

        // 新建会话
        function newChat() {
            if (!confirm('确定要开始新会话吗？当前对话将被清空。')) {
                return;
            }

            // 清空聊天界面
            chatContainer.innerHTML = `
                <div class="message assistant">
                    <div class="message-content">
                        你好！我是数据平台 AI 助手。你可以问我关于作业、数据源、FAQ 的问题，我会帮你查询和操作。
                    </div>
                </div>
            `;

            // 清除会话ID（localStorage + 内存）
            clearConversationId();

            // 重置状态
            statusEl.textContent = '新会话已创建，下次发送消息时将自动分配会话ID';
            statusEl.className = 'status';
        }

        // 回车发送
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        // 页面加载时初始化会话
        initConversation();
    </script>
</body>
</html>

spring:
  application:
    name: data-platform

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 3000ms

  # 数据库配置 - 请根据实际环境修改
  datasource:
    # MySQL 主数据源（MyBatis-Plus）
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/data_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: fra2781@
    # PostgreSQL 向量库数据源（Spring Data JPA）
    postgres:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://localhost:5433/knowledge_vector?useUnicode=true&characterEncoding=UTF-8&useSSL=false
      username: postgres
      password: FF9065
      jpa:
        hibernate:
          ddl-auto: none  # 使用 Flyway 管理表结构，禁止 Hibernate 自动建表
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

  # Spring AI 配置
  ai:
    openai:
      api-key: dummy
      base-url: https://api.openai.com
      chat:
        enabled: false
    # DashScope (阿里百炼) 自动配置
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.8-flash
          temperature: 0.7
      # Embedding 配置（用于向量化）
      embedding:
        enabled: true
        options:
          model: text-embedding-v3  # 阿里云 Embedding 模型，1024 维向量

  # Spring Mail 邮件服务配置
  # 生产环境建议通过环境变量 MAIL_PASSWORD 设置邮箱密码
  mail:
    host: smtp.163.com
    port: 465
    username: 17766238993@163.com
    password: ${MAIL_PASSWORD:ZRYM339mZrztCZyA}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
    default-encoding: UTF-8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
# 注意：生产环境请通过环境变量 JWT_SECRET 设置密钥
# 密钥必须至少 32 字符（256 位）
jwt:
  secret: ${JWT_SECRET:dataplatform-jwt-secret-key-at-least-32-characters-for-hs256-algorithm}
  expiration: 604800000  # 7天，单位：毫秒

# 服务器配置
server:
  port: 8089
  servlet:
    context-path: /

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: '*'  # 暴露所有端点
  endpoint:
    health:
      show-details: always  # 显示健康检查详情

# 日志配置
logging:
  level:
    com.dataplatform: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# AI 配置
ai:
  dashscope:
    # qwen3.8-flash - 主模型，用于意图识别和工具调用
    api-key: ${DASHSCOPE_API_KEY}
    base-url: https://ws-0qvl6bswjpub8oz9.cn-beijing.maas.aliyuncs.com/compatible-mode
    model: qwen3.8-flash  # 改为  (原 qwen-plus)
  deepseek:
    # DeepSeek-V3 - 备用模型，用于复杂推理
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
tool:
   governance:
     permission:
       deleteJob: []
       publishJob: []
     confirmation:
       enabled: true
       tools: [deleteJob, publishJob]
     timeout:
       default-ms: 30000
       write-operation-ms: 60000
       per-tool:
         executeSQL: 60000
         listRecentJobs: 15000
         searchJobs: 15000
         getJobDetails: 10000
     retry:
       enabled: true
       max-attempts: 3
       write-operations: false
   test:
     simulation:
       enabled: false  # 启用测试模拟
       mode: network-error  # timeout | network-error | delay
       target-tools: searchJobs,listRecentJobs  # 逗号分隔，为空则对所有工具生效
       fail-attempts: 10  # 始终失败（大于 max-attempts: 3）
       delay-ms: 5000  # delay 模式下的延迟时间
# Workflow Orchestration 配置
workflow:
  intent-classification:
    enabled: true
  rag:
    vector-sim-threshold: 0.5
    rerank-threshold: 0.6
  deterministic:
    require-confirmation: true
  responses:
    chitchat: "很高兴和你聊天！有什么数据平台相关的问题可以问我。"
    other: "抱歉，我只能回答数据平台相关的问题。"

# 知识库置信度闸配置
knowledge:
  confidence:
    # 综合置信度阈值，建议通过标定工具计算最优值
    # 通过 /confidence/calibrate 接口可基于评估集自动标定
    threshold: 0.17
  rerank:
    # 重排服务配置（已在RerankService中定义默认值）
    url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    model: qwen3.7-text-rerank


spring:
  application:
    name: data-platform-test

  # 测试环境数据源配置
  datasource:
    # MySQL 主数据源（用H2模拟）
    mysql:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
    # PostgreSQL 向量库数据源（测试时也用H2模拟）
    postgres:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:vectordb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      jpa:
        hibernate:
          ddl-auto: create-drop
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.H2Dialect
            format_sql: false

  h2:
    console:
      enabled: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  # Flyway 配置（测试环境-禁用）
  flyway:
    enabled: false

  # 使用schema.sql初始化H2
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  ai:
    openai:
      api-key: test-key
      base-url: https://api.openai.com
      chat:
        enabled: false
    # DashScope 配置（用于 Embedding 测试）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

  # 邮件配置（测试环境）
  mail:
    host: smtp.test.com
    port: 587
    username: test@test.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: test-secret-key-for-jwt-token-with-at-least-256-bits-length
  expiration: 86400000

# 日志配置
logging:
  level:
    com.dataplatform: info

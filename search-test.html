<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>向量检索测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select {
            width: 400px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #results {
            margin-top: 30px;
        }
        .result-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .result-item .score {
            color: #4CAF50;
            font-weight: bold;
        }
        .result-item .question {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .result-item .answer {
            color: #666;
            margin-bottom: 8px;
        }
        .result-item .meta {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>向量检索测试</h1>

    <div class="form-group">
        <label for="query">查询内容：</label>
        <input type="text" id="query" placeholder="输入查询内容" />
    </div>

    <div class="form-group">
        <label for="docType">文档类型：</label>
        <select id="docType">
            <option value="">全部</option>
            <option value="FAQ">FAQ</option>
            <option value="manual">手册</option>
        </select>
    </div>

    <div class="form-group">
        <label for="topK">返回数量：</label>
        <input type="number" id="topK" value="5" min="1" max="20" />
    </div>

    <button onclick="doSearch()">检索</button>

    <div id="results"></div>

    <script>
        async function doSearch() {
            const query = document.getElementById('query').value;
            const docType = document.getElementById('docType').value;
            const topK = parseInt(document.getElementById('topK').value);

            if (!query) {
                alert('请输入查询内容');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>检索中...</p>';

            try {
                const response = await fetch('http://localhost:8080/api/knowledge/search-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        docType: docType || null,
                        topK: topK
                    })
                });

                const result = await response.json();

                if (result.code === 0 && result.data) {
                    displayResults(result.data);
                } else {
                    resultsDiv.innerHTML = `<p style="color: red;">检索失败: ${result.message || '未知错误'}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">请求失败: ${error.message}</p>`;
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p>未找到匹配结果</p>';
                return;
            }

            let html = `<h2>检索结果 (共 ${results.length} 条)</h2>`;

            results.forEach((item, index) => {
                html += `
                    <div class="result-item">
                        <div class="question">
                            ${index + 1}. ${item.questions || '无标题'}
                            <span class="score">相似度: ${(item.score).toFixed(2)}</span>
                        </div>
                        <div class="answer">${item.answer || '无答案'}</div>
                        <div class="meta">
                            ID: ${item.id} |
                            类型: ${item.docType || 'N/A'} |
                            文档ID: ${item.docId || 'N/A'} |
                            路径: ${item.sectionPath || 'N/A'}
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>

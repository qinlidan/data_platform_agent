version: '3.8'

services:
  backend:
    build: .
    container_name: data-platform-backend
    restart: always
    environment:
      # API Keys - 部署时需要设置
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-ZRYM339mZrztCZyA}
      - JWT_SECRET=${JWT_SECRET:-dataplatform-jwt-secret-key-at-least-32-characters-for-hs256-algorithm}
      # 时区设置
      - TZ=Asia/Shanghai
    volumes:
      # 日志持久化
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: data-platform-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
